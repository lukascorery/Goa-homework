<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
</head>
<body>
    <h1>Rock Paper Scissors Game</h1>

    <p id="playerScoreP">Your score: 0</p>
    <p id="compScoreP">Computer score: 0</p>
    <p id="compChoiceP">Computer choice:</p>

    <p id="gameRes">Win/Loss</p>

    <br><br>

    <div id="choice">
        <button id="rock" onclick="gameLog('rock')">Rock</button>
        <button id="paper" onclick="gameLog('paper')">Paper</button>
        <button id="scissors" onclick="gameLog('scissors')">Scissors</button>
    </div>

    <script src="cw2.js"></script>
</body>
