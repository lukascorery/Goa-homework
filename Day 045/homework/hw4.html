 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="hw4.css">
 </head>
 <body>
    <div id="box">

        <h1 id="h1">Contact Us</h1>
        
        <div id="first">
            <label for="firstname">First Name</label>
            <br>
        <input type="text" id="firstname">
        </div>

        <div id="last">
            <label for="lastname">Last Name</label>
            <br>
            <input type="text" id="lastname">
        </div>

        <label for="email">Email Address</label>
        <br>
        <input type="email" id="email">
        <br><br>

        <label for="General-Enquiry"> Query Type</label>
        <br><br>
        
        <input type="radio" id="General-Enquiry" >
        <label for="General-Enquiry">General-Enquiry</label>
        
        <input type="radio" id="Supportrequest" >
        <label for="Supportrequest">Support Request</label>
        <br><br>

        <label for="message">Message</label>
        <br>
        <input type="text" id="message">
        <br><br>

        <input type="checkbox" id="consent">
        <label for="consent">I consent to being contacted by the team</label>
        <br><br>

        <button id="button">Submit</button>
    </div>

 </body>
 </html>
