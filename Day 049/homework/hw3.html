<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="hw3.css">
</head>
<body>
    <div class="left-side"><img src="hw3/background.png" alt=""></div>

    <div id="box">
        <img src="hw3/hw3.jpg" alt="Profile Picture">
        <p>Sign In</p>

        <input type="email" class="email" placeholder="Email Address">
        <input type="password" class="password" placeholder="Password">

        <a href="#"><p class="link-btn">Forgot password?</p></a>
        <button class="sign-in-btn">Sign In</button>
        <a href="#"><p class="link-btn">Don't have an account? Sign Up</p></a>
    </div>
</body>
</html>
