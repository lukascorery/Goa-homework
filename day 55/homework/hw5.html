<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solar System</title>
  <link rel="stylesheet" href="hw5.css" />
</head>
<body>

<div class="solar-system">

  <div class="sun"></div>

  <div class="orbit o1"><div class="planet mercury"></div></div>
  <div class="orbit o2"><div class="planet venus"></div></div>
  <div class="orbit o3"><div class="planet earth"></div></div>
  <div class="orbit o4"><div class="planet mars"></div></div>
  <div class="orbit o5"><div class="planet jupiter"></div></div>
  <div class="orbit o6"><div class="planet saturn"></div></div>
  <div class="orbit o7"><div class="planet uranus"></div></div>
  <div class="orbit o8"><div class="planet neptune"></div></div>
  <div class="orbit o9"><div class="planet pluto"></div></div>

</div>

</body>
</html>
